plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
   // Selenium
    implementation("org.seleniumhq.selenium:selenium-java:4.45.0")

    // WebDriver Manager
    implementation("io.github.bonigarcia:webdrivermanager:6.3.4")

    // JUnit 5
    testImplementation("org.junit.jupiter:junit-jupiter:5.13.4")

    // Apache Commons IO - screenshots/file handling
    implementation("commons-io:commons-io:2.20.0")

    // Guava - only if your project actually uses it
    implementation("com.google.guava:guava:33.5.0-jre")
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use TestNG test framework
            useTestNG('7.5.1')
        }
    }
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'org.example.Qsanity'
}
